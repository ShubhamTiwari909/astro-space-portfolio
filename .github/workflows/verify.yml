# Master plan Phase 6 task 9, §34.4.
#
# The point of this workflow is that the guarantees the plan spent pages
# arguing for cannot quietly stop being true. Every gate here corresponds to
# a written promise:
#
#   lint:tokens     no hardcoded design values, and the Tailwind v4 shorthand
#   check           no type errors
#   test:content    every fact ships as text, with no JavaScript (§25.0)
#   test:budgets    critical-path JS, scene chunk, per-route JS (§26.2)
#   test:scene      the canvas is removable by construction (§34.3)
#   test:flight     the camera path is continuous and forward (§4.1)
#   test:contrast   §25.2's table matches the shipped CSS
#   test:browser    axe-core WCAG 2.2 AA, overflow at nine widths, tap
#                   targets, keyboard order, forced colors, reflow, no-JS
#
# A failure here is not a formality. Two of these gates have already caught
# real regressions that no amount of review would have: the scene-chunk
# budget silently stopped measuring three.js when the bundler moved it to a
# shared chunk, and §25.2's contrast table had drifted by up to 1.7 with two
# bands overstated.

name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser suite drives real Chrome through playwright-core, which
      # ships no browser of its own. `--only-shell` fetches the headless
      # shell instead of the full browser: same engine, much smaller.
      - name: Install Chromium for the browser suite
        run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - name: Verify
        run: pnpm verify
        env:
          # The suite launches Chrome by channel locally, where a real
          # Chrome exists. In CI there is only the Playwright build, so it
          # is told to use that instead.
          BROWSER_CHANNEL: ''

      # The art plates and the Orbit poster are committed and generated by
      # separate scripts (`pnpm art`, `pnpm poster`), so a plain build must
      # never touch them. Scoped to the asset directories rather than the
      # whole tree, so an unrelated file cannot fail the run spuriously.
      - name: Assert committed assets are unchanged by the build
        run: git diff --exit-code --stat -- src/assets public
